<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Relationship Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">
        <h1>🤖 AI Relationship Generator</h1>
        <p class="subtitle">Generate company relationships using AI</p>
        
        <div class="form-section">
            <form id="generateForm">
                <div class="form-group">
                    <label for="companyTicker">Stock Ticker (e.g., AAPL, MSFT, GOOGL):</label>
                    <input type="text" 
                           id="companyTicker" 
                           placeholder="Enter NASDAQ ticker" 
                           maxlength="5"
                           required>
                    <small style="color: #666; display: block; margin-top: 5px;">
                        Will automatically validate and fetch company information
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="relationshipCount">Number of relationships to generate:</label>
                    <input type="number" 
                           id="relationshipCount" 
                           name="count" 
                           min="1" 
                           max="20" 
                           value="5"
                           required>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="includeMetadata" checked>
                        Include metadata (alpha, beta, decay, threshold, weight)
                    </label>
                </div>
                
                <button type="submit" 
                        id="generateBtn" 
                        class="btn btn-primary">
                    Generate Relationships
                </button>
            </form>
        </div>
        
        <div id="validatingStatus" class="loading hidden">
            <p>🔍 Step 1/2: Validating ticker and fetching company info...</p>
        </div>
        
        <div id="generatingStatus" class="loading hidden">
            <p>🤖 Step 2/2: Generating relationships with AI...</p>
        </div>
        
        <div id="error" class="error hidden"></div>
    </div>
    
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
